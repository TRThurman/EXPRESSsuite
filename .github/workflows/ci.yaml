name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x]  # Langium 4.2 codegen uses Object.groupBy (Node ≥ 21).
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Langium artifacts
        run: npm run langium:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --run

  audit:
    name: Audit dependencies
    # Its own job, not a step in `test`: an advisory is not a test failure, and
    # while it lived in `test` it turned all three platforms red and skipped
    # `package` entirely, so packaging was never exercised.
    #
    # One runner, because the dependency tree does not vary by OS, and no
    # `npm ci`, because `npm audit` resolves from package-lock.json alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Production dependencies
        # The gate. Anything the extension ships must be clean.
        run: npm audit --omit=dev

      - name: Development advisories
        # Reported, not enforced. The current advisories are release tooling
        # (undici, reached through release-it) which never ships in the .vsix and
        # never runs in a user's editor. Visible as a warning without failing CI.
        continue-on-error: true
        run: npm audit

  lean:
    name: Lean proofs
    # The proofs behind the type checks (lean/README.md). lean/check.sh runs
    # `lake build`, which fails on a proof that does not check or a #guard that
    # does not hold, and then fails on a `sorry` or on an axiom other than
    # propext, Classical.choice and Quot.sound. Pure Lean 4 core, no Mathlib:
    # elan installs the toolchain pinned in lean/lean-toolchain and the build
    # takes about a minute, so nothing is cached. One runner, because the
    # proofs do not vary by OS. Lean names cited in src/, docs/ and
    # lean/README.md are checked by src/test/lean-citations.test.ts in `test`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install elan
        # The installer at a release tag, not master; no default toolchain,
        # so the one in lean/lean-toolchain is the one used.
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build and check the proofs
        run: lean/check.sh

  corpus:
    name: SMRL v8 corpus
    # The EXPRESS schemas of the published ISO 10303 SMRL v8 (test-fixtures/
    # smrlv8) as a regression corpus: the 1,287 files the default settings admit
    # as one workspace, then the 103 long forms, each diagnostic compared with
    # the baselines in test-fixtures/smrlv8-baseline. Minutes and a multi-GB
    # heap, so one Linux runner rather than the test matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Langium artifacts
        run: npm run langium:generate

      - name: Census against the baselines
        run: npm run test:smrlv8

  package:
    name: Package .vsix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Langium artifacts
        run: npm run langium:generate

      - name: Install vsce
        run: npm i -g @vscode/vsce

      - name: Package extension
        run: vsce package

      - name: Upload .vsix
        uses: actions/upload-artifact@v7
        with:
          name: expresssuite-${{ matrix.os }}.vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
