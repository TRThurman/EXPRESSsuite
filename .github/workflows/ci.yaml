name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x]  # Langium 4.2 codegen uses Object.groupBy (Node ≥ 21).
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Langium artifacts
        run: npm run langium:generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --run

      - name: Audit dependencies
        run: npm audit

  package:
    name: Package .vsix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Langium artifacts
        run: npm run langium:generate

      - name: Install vsce
        run: npm i -g @vscode/vsce

      - name: Package extension
        run: vsce package

      - name: Upload .vsix
        uses: actions/upload-artifact@v7
        with:
          name: expresssuite-${{ matrix.os }}.vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
