name: Create release version
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Explicit version, e.g. 0.4.2. Leave blank to infer the increment from
          conventional commits. An explicit value is needed when promoting a
          pre-release, because there are no new feat/fix commits to infer from.
        required: false
        type: string
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Step `if` cannot read the `secrets` context, and a step's own `env` is not
      # visible to its `if`. Deriving a boolean here is the documented workaround:
      # the value is "true"/"false", so the token itself is not exposed job-wide.
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
    permissions:
      # release-it pushes the release commit and tag and creates the GitHub
      # Release. The repository default for GITHUB_TOKEN is read-only, so
      # without this the push fails with 403 for github-actions[bot].
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install deps
        run: npm ci
      - name: Init git user
        run: |
          git config --global user.email "thomas.r.thurman@imonmail.com"
          git config --global user.name "TRThurman"
      - name: Install vsce
        run: npm i -g @vscode/vsce
      - name: Generate language utilities
        run: npm run langium:generate
      - name: Release extension
        # `npm run release` alone infers the increment from conventional commits.
        # Promoting a pre-release has no new feat/fix commits since the tag, so the
        # recommendation is empty and release-it resolves the version to null. The
        # optional input supplies it explicitly; blank preserves inference.
        run: npm run release -- ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Publish to the VS Code Marketplace
        # Publishes the exact .vsix that release-it's `before:github:release` hook
        # built and attached to the GitHub Release, so the Marketplace bits are
        # byte-identical to the release asset. Skipped when no VSCE_PAT secret is
        # configured, which keeps the workflow usable on forks. A Marketplace
        # version number can never be reused -- only unpublished -- so this runs
        # only after release-it has succeeded, and only on the public release
        # workflow, never on release-pre.
        if: env.HAS_VSCE_PAT == 'true'
        run: |
          shopt -s nullglob
          pkgs=(*.vsix)
          if [ ${#pkgs[@]} -ne 1 ]; then
            echo "expected exactly one .vsix in the workspace, found ${#pkgs[@]}: ${pkgs[*]}" >&2
            exit 1
          fi
          echo "publishing ${pkgs[0]}"
          vsce publish --packagePath "${pkgs[0]}" --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: End message
        run: echo 'Done'
